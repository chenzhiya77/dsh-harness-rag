[project]
name = "deerflow-harness"
version = "2.1.0"
description = "DeerFlow agent harness framework"
requires-python = ">=3.12"
dependencies = [
    # The engine ships the knowledge service only. Dormant agent/sandbox
    # modules are not imported by the entrypoint, so their packages are not
    # installed; optional providers remain available through the extras below.
    # Exact pin by design (extension-system version contract): the host pins
    # the contract version it implements, extensions declare ranges. A range
    # here would let pip resolve a newer contract package than this harness
    # implements, making newer extensions look supported at runtime.
    "ddgs>=9.10.0",
    "deerflow-extension-api==0.1.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.0",
    # Lower bound reflects what the lockfile resolves and tests run against
    # (langgraph 1.2.9 pulls langchain >=1.3 transitively).
    "langchain>=1.3",
    "langchain-anthropic>=1.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.9,<1.3",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.0.1a2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<3.2",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "cryptography>=50.0.0",
    "qdrant-client>=1.19.0",
    "networkx>=3.6.1",
    # Declared explicitly (previously only pulled in transitively by
    # qdrant-client): direct dependency of the knowledge projection reducer.
    "numpy>=1.26",
]

[project.scripts]
deerflow = "deerflow.tui.cli:main"

[project.optional-dependencies]
# Terminal workbench (TUI). Kept optional so the core harness install stays lean;
# the `deerflow` console script degrades to headless help when textual is absent.
tui = ["textual>=0.80"]
# GroundRoute needs no extra packages (httpx is already a core dependency). This
# empty extra exists so the documented `uv add 'deerflow-harness[groundroute]'`
# install command resolves cleanly without an "unknown extra" warning.
groundroute = []
ollama = ["langchain-ollama>=0.3.0"]
postgres = [
    "asyncpg>=0.29",
    "langgraph-checkpoint-postgres>=3.1.0,<3.2",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
# Cross-process SSE stream bridge (stream_bridge.type: redis). Optional so
# single-process / memory-bridge installs do not pull redis. The Docker image
# always installs this extra because Docker defaults to the redis bridge.
redis = ["redis>=5.0.0"]
pymupdf = ["pymupdf4llm>=0.0.17"]
# Vector-space projection UMAP reducer (spec 2026-08-15 §4): strictly optional —
# drags numba/llvmlite (~100MB); PCA stays the built-in zero-extra default and
# is the only algo supporting the query-transform overlay.
umap = ["umap-learn>=0.5.7"]
boxlite = ["boxlite>=0.9.7"]
# Tenki cloud sandbox provider (deerflow.community.tenki). Optional so a default
# install stays free of the Tenki SDK; only pulled in when the provider is used.
tenki = ["tenki-sandbox>=0.4.0"]
# Agent observability (Monocle). Optional so a default install stays free of the
# OpenTelemetry stack; only pulled in when MONOCLE_TRACING is used.
monocle = ["monocle_apptrace>=0.8.8"]
# Agentic browser control (browser_navigate/click/type/... tool group). Optional
# so the core harness install stays lean; import is lazy inside the private
# Playwright loop. After install, run `playwright install chromium` once.
browser = ["playwright>=1.40"]
# Optional Chinese tokenization for the FTS5 memory retrieval adapter.
memory-zh = ["jieba>=0.42.1"]
# RAGAS end-to-end evaluation (spec 2026-08-23 §8): optional at the library
# level; the backend app enables it by default (backend/pyproject.toml) so a
# standard install can run L2 evaluation.
# langchain-community<0.4: ragas 0.4.3 still imports
# `langchain_community.chat_models.vertexai`, which 0.4 removed — pin until
# ragas releases a fix (then drop the cap).
ragas = ["ragas>=0.2.15", "langchain-community<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow"]
