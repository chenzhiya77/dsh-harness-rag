name: Lint Check

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check uv.lock is in sync
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint
