# dsh-harness-rag bundle patch (declared by the `dsh.bundle.patch` manifest
# field): inserts the harness-rag row into any profile that lists
# dsh-harness-rag in its `dsh.profile.bundles`. The row loads the plugin by
# package name from the profile's node_modules.

- insert:
    - id: harness-rag
      name: dsh-harness-rag
      config:
        # Empty = run the bundled local knowledge service (provisioned on first
        # use); non-empty = talk to an external service and download nothing.
        backendUrl: ''
        # External mode: optional Bearer token. Managed mode ignores this value
        # and uses the token recorded in state/service.json.
        apiToken: ''
